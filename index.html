<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nature's Canvas — Wild Beauty Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --ink:       #0b0c0a;
      --ink2:      #131510;
      --verdant:   #1a3a1e;
      --leaf:      #2d5a34;
      --mist:      #7a9e7e;
      --fog:       #b2c5b4;
      --parchment: #f2ead8;
      --sand:      #e8dcc4;
      --ember:     #c96b30;
      --sol:       #e8a33a;
      --dawn:      #f0c060;
      --white:     #fefdf9;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--parchment);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: default;
    }

    /* ─── GRAIN OVERLAY ──────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px;
    }

    /* ─── AMBIENT GLOWS ──────────────────────────────── */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      animation: driftBlob 20s ease-in-out infinite alternate;
    }
    .ambient-blob:nth-child(1) {
      width: 700px; height: 700px;
      top: -200px; left: -200px;
      background: radial-gradient(circle, rgba(29,80,35,0.45), transparent 70%);
      animation-duration: 22s;
    }
    .ambient-blob:nth-child(2) {
      width: 500px; height: 500px;
      bottom: -100px; right: -100px;
      background: radial-gradient(circle, rgba(201,107,48,0.22), transparent 70%);
      animation-duration: 18s;
      animation-direction: alternate-reverse;
    }
    .ambient-blob:nth-child(3) {
      width: 350px; height: 350px;
      top: 40%; left: 50%;
      background: radial-gradient(circle, rgba(232,163,58,0.12), transparent 70%);
      animation-duration: 25s;
    }
    @keyframes driftBlob {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    /* ─── WRAPPER ────────────────────────────────────── */
    .wrap {
      position: relative;
      z-index: 2;
      max-width: 1680px;
      margin: 0 auto;
      padding: 0 28px 80px;
    }

    /* ─── HEADER ─────────────────────────────────────── */
    .masthead {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      padding: 52px 0 48px;
      position: relative;
    }

    .masthead-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--mist);
      opacity: 0;
      animation: riseIn 0.7s var(--ease-out-expo) 0.1s forwards;
    }
    .curator {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sol);
      opacity: 0;
      animation: riseIn 0.7s var(--ease-out-expo) 0.25s forwards;
    }

    .brand {
      text-align: center;
      opacity: 0;
      animation: riseIn 0.9s var(--ease-out-expo) 0.05s forwards;
    }
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 7vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: var(--white);
      white-space: nowrap;
    }
    .brand-title em {
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(100deg, var(--sol), var(--ember));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .brand-rule::before,
    .brand-rule::after {
      content: '';
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sol));
    }
    .brand-rule::after {
      background: linear-gradient(90deg, var(--sol), transparent);
    }
    .brand-rule-icon {
      color: var(--sol);
      font-size: 0.65rem;
      opacity: 0.7;
      display: flex;
      gap: 8px;
    }

    .masthead-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      opacity: 0;
      animation: riseIn 0.7s var(--ease-out-expo) 0.3s forwards;
    }
    .tagline {
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--fog);
      text-align: right;
      line-height: 1.7;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* horizontal rule under header */
    .masthead-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--verdant) 20%, var(--leaf) 50%, var(--verdant) 80%, transparent 100%);
      margin-bottom: 28px;
      opacity: 0;
      animation: riseIn 1s var(--ease-out-expo) 0.5s forwards;
    }

    /* ─── TOOLBAR ────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 28px;
      flex-wrap: wrap;
      gap: 14px;
      opacity: 0;
      animation: riseIn 0.7s var(--ease-out-expo) 0.6s forwards;
    }

    #countLabel {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mist);
    }
    #countLabel strong {
      font-size: 1.4rem;
      font-weight: 200;
      color: var(--dawn);
      letter-spacing: -0.02em;
      font-family: 'Playfair Display', serif;
      line-height: 1;
    }
    #countLabel .cnt-sep {
      width: 1px;
      height: 20px;
      background: var(--leaf);
    }

    .view-buttons {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 4px;
    }
    .view-btn {
      background: none;
      border: none;
      padding: 7px 14px;
      border-radius: 7px;
      color: var(--fog);
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
    }
    .view-btn i { font-size: 0.8rem; }
    .view-btn:hover { color: var(--white); }
    .view-btn.active {
      background: rgba(255,255,255,0.09);
      color: var(--dawn);
    }

    /* ─── GALLERY GRID ───────────────────────────────── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 70px;
    }

    @media (min-width: 640px) {
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
    @media (min-width: 900px) {
      .gallery { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    }
    @media (min-width: 1200px) {
      .gallery { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }

    .gallery.compact { gap: 8px; }
    .gallery.compact .photo-card { border-radius: 10px; }
    .gallery.compact .photo-card-inner { border-radius: 8px; }
    .gallery.compact .photo-img { border-radius: 8px; }

    /* Card */
    .photo-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3/2;
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      transition: opacity 0.55s var(--ease-out-expo),
                  transform 0.55s var(--ease-out-expo),
                  box-shadow 0.3s ease;
      background: var(--ink2);
      /* gold border via box shadow, not DOM */
      box-shadow: 0 0 0 1px rgba(232,163,58,0.08), 0 8px 24px rgba(0,0,0,0.45);
    }

    .photo-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .photo-card:hover {
      box-shadow: 0 0 0 1px rgba(232,163,58,0.35), 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(201,107,48,0.12);
      transform: translateY(-6px) scale(1.01);
    }

    .photo-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 16px;
      transition: transform 0.55s var(--ease-out-expo),
                  filter 0.3s ease;
      filter: brightness(0.95) saturate(1.08);
    }
    .photo-card:hover .photo-img {
      transform: scale(1.06);
      filter: brightness(1.04) saturate(1.14) contrast(1.02);
    }

    /* Hover shine overlay */
    .photo-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .photo-card:hover::after { opacity: 1; }

    /* Bottom gradient + index number */
    .photo-card-inner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(to top, rgba(8,10,7,0.7), transparent);
      border-radius: 0 0 16px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .photo-card:hover .photo-card-inner::after { opacity: 1; }

    .card-num {
      position: absolute;
      bottom: 10px;
      right: 13px;
      font-family: 'Playfair Display', serif;
      font-size: 0.7rem;
      color: rgba(242,234,216,0.55);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s ease 0.05s;
      z-index: 2;
    }
    .photo-card:hover .card-num { opacity: 1; }

    /* ─── LOADING STATE ──────────────────────────────── */
    .loading-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      gap: 28px;
    }

    .load-ring {
      width: 56px;
      height: 56px;
      position: relative;
    }
    .load-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--sol);
      border-right-color: rgba(232,163,58,0.3);
      animation: spin 1s linear infinite;
    }
    .load-ring::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-bottom-color: var(--ember);
      animation: spin 1.5s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state p {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--mist);
    }

    /* ─── EMPTY STATE ────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 100px 20px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      background: rgba(255,255,255,0.02);
    }
    .empty-icon {
      width: 90px; height: 90px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 1px solid rgba(232,163,58,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      color: var(--sol);
      background: radial-gradient(circle, rgba(232,163,58,0.08), transparent);
    }
    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      font-style: italic;
      color: var(--parchment);
      margin-bottom: 12px;
    }
    .empty-state p { font-size: 0.82rem; color: var(--mist); margin-bottom: 14px; line-height: 1.8; }
    .empty-state code {
      display: inline-block;
      background: rgba(0,0,0,0.5);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--dawn);
      margin: 3px;
    }

    /* ─── FOOTER ─────────────────────────────────────── */
    .footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    #footerCount {
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--mist);
    }
    #footerCount strong {
      font-size: 1.2rem;
      font-weight: 300;
      color: var(--dawn);
      font-family: 'Playfair Display', serif;
    }
    .footer-quote {
      font-size: 0.68rem;
      font-style: italic;
      color: rgba(178,197,180,0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.02em;
    }
    .footer-quote i { font-size: 0.6rem; color: var(--sol); opacity: 0.4; }

    /* ─── SCROLL TOP ─────────────────────────────────── */
    .scroll-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px; height: 44px;
      background: rgba(11,12,10,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(232,163,58,0.3);
      border-radius: 50%;
      color: var(--sol);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s ease, border-color 0.2s ease;
      z-index: 200;
    }
    .scroll-top.show { opacity: 1; transform: translateY(0); }
    .scroll-top:hover {
      background: rgba(201,107,48,0.18);
      border-color: var(--sol);
      transform: translateY(-3px);
    }

    /* ─── LIGHTBOX ───────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5,7,5,0.97);
      backdrop-filter: blur(28px) saturate(1.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    /* Top bar */
    .lightbox-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(5,7,5,0.8), transparent);
      transform: translateY(-100%);
      transition: transform 0.35s var(--ease-out-expo);
    }
    .lightbox.open .lightbox-header { transform: translateY(0); }

    .lightbox-filename {
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(178,197,180,0.6);
    }

    .lightbox-actions { display: flex; gap: 8px; }
    .lightbox-btn {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--fog);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .lightbox-btn:hover {
      background: rgba(232,163,58,0.15);
      border-color: rgba(232,163,58,0.4);
      color: var(--dawn);
      transform: scale(1.06);
    }

    /* Nav arrows */
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      color: var(--fog);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .lightbox-nav:hover {
      background: rgba(232,163,58,0.15);
      border-color: rgba(232,163,58,0.4);
      color: var(--dawn);
      transform: translateY(-50%) scale(1.08);
    }
    .lightbox-nav.prev { left: 24px; }
    .lightbox-nav.next { right: 24px; }
    .lightbox-nav.hidden { opacity: 0; pointer-events: none; }

    /* Image */
    .lightbox-content {
      position: relative;
      z-index: 5;
      max-width: 90vw;
      max-height: 88vh;
    }
    #lb-img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      transition: transform 0.35s ease, opacity 0.25s ease;
    }
    #lb-img.loading { opacity: 0; }

    .lightbox.zoomed #lb-img {
      transform: scale(1.5);
      cursor: zoom-out;
    }

    .lightbox-caption {
      position: absolute;
      bottom: -28px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: rgba(178,197,180,0.4);
    }

    /* ─── SCROLLBAR ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--verdant); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sol); }

    ::selection { background: rgba(232,163,58,0.25); color: var(--white); }

    /* ─── MOBILE TWEAKS ──────────────────────────────── */
    @media (max-width: 600px) {
      .wrap { padding: 0 14px 60px; }
      .masthead { grid-template-columns: 1fr; gap: 16px; padding: 36px 0 32px; }
      .masthead-left, .masthead-right { display: none; }
      .brand { text-align: left; }
      .toolbar { padding-bottom: 20px; }
      .lightbox-nav.prev { left: 10px; }
      .lightbox-nav.next { right: 10px; }
      .lightbox-nav { width: 38px; height: 38px; }
      .scroll-top { bottom: 20px; right: 20px; width: 38px; height: 38px; font-size: 0.85rem; }
    }
    @media (max-width: 900px) {
      .footer { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Ambient blobs -->
  <div class="ambient">
    <div class="ambient-blob"></div>
    <div class="ambient-blob"></div>
    <div class="ambient-blob"></div>
  </div>

  <div class="wrap">

    <!-- ── MASTHEAD ── -->
    <header class="masthead">
      <div class="masthead-left">
        <span class="eyebrow">Wilderness Chronicles</span>
        <span class="curator">Curated by Prasad</span>
      </div>

      <div class="brand">
        <h1 class="brand-title">Nature's&thinsp;<em>Canvas</em></h1>
        <div class="brand-rule">
          <div class="brand-rule-icon">
            <i class="fa-regular fa-leaf"></i>
            <i class="fa-regular fa-mountain"></i>
            <i class="fa-regular fa-water"></i>
          </div>
        </div>
      </div>

      <div class="masthead-right">
        <p class="tagline">Stories written<br>by light &amp; wild things</p>
      </div>
    </header>

    <div class="masthead-line"></div>

    <!-- ── TOOLBAR ── -->
    <div class="toolbar">
      <div id="countLabel">
        <i class="fa-regular fa-images" style="color:var(--sol);font-size:1rem;"></i>
        <span class="cnt-sep"></span>
        <span>loading gallery…</span>
      </div>
      <div class="view-buttons">
        <button class="view-btn active" id="btnNormal">
          <i class="fa-regular fa-grid-2"></i> Grid
        </button>
        <button class="view-btn" id="btnCompact">
          <i class="fa-regular fa-rectangle-ad"></i> Compact
        </button>
      </div>
    </div>

    <!-- ── GALLERY ── -->
    <div id="gallery" class="gallery">
      <div class="loading-state" id="loadMsg">
        <div class="load-ring"></div>
        <p>gathering moments from nature…</p>
      </div>
    </div>

    <!-- ── FOOTER ── -->
    <footer class="footer">
      <div id="footerCount"></div>
      <div class="footer-quote">
        <i class="fa-regular fa-quote-left"></i>
        in every walk with nature, one receives far more than he seeks
        <i class="fa-regular fa-quote-right"></i>
      </div>
    </footer>

  </div><!-- /wrap -->

  <!-- Scroll to Top -->
  <button class="scroll-top" id="scrollTop">
    <i class="fa-regular fa-arrow-up"></i>
  </button>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <div class="lightbox-backdrop" id="lbBackdrop"></div>

    <button class="lightbox-nav prev" id="lb-prev">
      <i class="fa-regular fa-chevron-left"></i>
    </button>
    <button class="lightbox-nav next" id="lb-next">
      <i class="fa-regular fa-chevron-right"></i>
    </button>

    <div class="lightbox-header">
      <span class="lightbox-filename" id="lbFilename"></span>
      <div class="lightbox-actions">
        <button class="lightbox-btn" id="lbZoom" title="Zoom">
          <i class="fa-regular fa-magnifying-glass-plus"></i>
        </button>
        <a class="lightbox-btn" id="lbDownload" title="Download" download>
          <i class="fa-regular fa-download"></i>
        </a>
        <button class="lightbox-btn" id="lbClose" title="Close">
          <i class="fa-regular fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="lightbox-content">
      <img id="lb-img" src="" alt="" />
    </div>

    <div class="lightbox-caption" id="lbCaption"></div>
  </div>

  <script>
    /* ==========================================================
       ALL LOGIC PRESERVED — ZERO CHANGES TO FUNCTIONALITY
    ========================================================== */

    const CFG = {
      path:     'images/',
      manifest: 'images/manifest.json',
      formats:  ['.jpg','.jpeg','.png','.webp','.gif','.avif']
    };

    let images = [];
    let loadedN = 0;
    let currentIdx = -1;

    const gallery     = document.getElementById('gallery');
    const loadMsg     = document.getElementById('loadMsg');
    const countLabel  = document.getElementById('countLabel');
    const footerCnt   = document.getElementById('footerCount');
    const lightbox    = document.getElementById('lightbox');
    const lbImg       = document.getElementById('lb-img');
    const lbBackdrop  = document.getElementById('lbBackdrop');
    const lbClose     = document.getElementById('lbClose');
    const lbZoom      = document.getElementById('lbZoom');
    const lbDownload  = document.getElementById('lbDownload');
    const lbPrev      = document.getElementById('lb-prev');
    const lbNext      = document.getElementById('lb-next');
    const lbFilename  = document.getElementById('lbFilename');
    const lbCaption   = document.getElementById('lbCaption');
    const scrollTopB  = document.getElementById('scrollTop');
    const btnNormal   = document.getElementById('btnNormal');
    const btnCompact  = document.getElementById('btnCompact');

    async function discover() {
      try {
        const r = await fetch(CFG.manifest);
        if (r.ok) {
          const list = await r.json();
          if (Array.isArray(list) && list.length) {
            build(list.map(f => ({ src: CFG.path + f, name: f })));
            return;
          }
        }
      } catch (_) {}

      try {
        const r = await fetch(CFG.path);
        if (r.ok) {
          const html = await r.text();
          const doc  = new DOMParser().parseFromString(html, 'text/html');
          const names = [...doc.querySelectorAll('a[href]')]
            .map(a => a.getAttribute('href'))
            .filter(h => CFG.formats.some(e => h.toLowerCase().endsWith(e)))
            .map(h => h.split('/').pop());
          if (names.length) {
            build(names.map(f => ({ src: CFG.path + f, name: f })));
            return;
          }
        }
      } catch (_) {}

      build([]);
    }

    function build(list) {
      if (loadMsg) loadMsg.remove();

      if (!list.length) {
        gallery.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fa-regular fa-tree"></i></div>
            <h3>no photographs yet</h3>
            <p>add images to <code>/images</code> and create<br/><code>images/manifest.json</code></p>
            <code>["sunset.jpg", "forest.png", "river.webp"]</code>
          </div>`;
        updateCounts();
        return;
      }

      images = list;
      list.forEach((img, i) => addFrame(img, i));
      revealOnScroll();
    }

    function addFrame({ src, name }, idx) {
      const frame = document.createElement('div');
      frame.className = 'photo-card';
      frame.setAttribute('role', 'listitem');
      frame.setAttribute('tabindex', '0');
      frame.dataset.idx = idx;

      const inner = document.createElement('div');
      inner.className = 'photo-card-inner';

      const img = document.createElement('img');
      img.className = 'photo-img';
      img.alt     = name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      img.loading = 'lazy';
      img.decoding = 'async';

      img.onload  = () => { loadedN++; updateCounts(); };
      img.onerror = () => { images[idx] = null; frame.remove(); updateCounts(); };
      img.src = src;

      const num = document.createElement('span');
      num.className = 'card-num';
      num.textContent = String(idx + 1).padStart(2, '0');

      inner.appendChild(img);
      inner.appendChild(num);
      frame.appendChild(inner);
      gallery.appendChild(frame);

      frame.addEventListener('click', () => openLB(idx));
      frame.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLB(idx); }
      });
    }

    function revealOnScroll() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const frames = [...gallery.querySelectorAll('.photo-card')];
          const i = frames.indexOf(entry.target);
          setTimeout(() => entry.target.classList.add('visible'), Math.min(i * 35, 350));
          io.unobserve(entry.target);
        });
      }, { rootMargin: '0px 0px 100px 0px' });
      gallery.querySelectorAll('.photo-card').forEach(f => io.observe(f));
    }

    function updateCounts() {
      const text = loadedN === 1 ? 'photograph' : 'photographs';
      countLabel.innerHTML = `
        <i class="fa-regular fa-images" style="color:var(--sol);font-size:1rem;"></i>
        <span class="cnt-sep"></span>
        <strong>${loadedN}</strong>&thinsp;<span style="font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--mist)">${text}</span>`;
      footerCnt.innerHTML = `<strong>${loadedN}</strong>&thinsp;${text} in collection`;
    }

    function pretty(f) { return f.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '); }

    function openLB(idx) {
      if (!images[idx]) return;
      currentIdx = idx;

      lbImg.classList.add('loading');
      lbImg.onload = () => lbImg.classList.remove('loading');
      lbImg.src    = images[idx].src;
      lbImg.alt    = pretty(images[idx].name);

      lbFilename.textContent = images[idx].name;
      lbDownload.href = images[idx].src;
      lbDownload.setAttribute('download', images[idx].name);

      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      updateNav();
      if (lbClose) lbClose.focus();
    }

    function closeLB() {
      lightbox.classList.remove('open', 'zoomed');
      document.body.style.overflow = '';
      setTimeout(() => { if (lbImg) lbImg.src = ''; }, 300);
      currentIdx = -1;
    }

    function navigate(dir) {
      let n = currentIdx + dir;
      const max = images.length - 1;
      if (n < 0) n = max;
      if (n > max) n = 0;
      let tries = 0;
      while (!images[n] && tries++ < images.length) {
        n += dir;
        if (n < 0) n = max;
        if (n > max) n = 0;
      }
      openLB(n);
    }

    function updateNav() {
      const valid = images.filter(Boolean).length;
      if (lbPrev) lbPrev.classList.toggle('hidden', valid <= 1);
      if (lbNext) lbNext.classList.toggle('hidden', valid <= 1);
    }

    if (lbClose)    lbClose.addEventListener('click', closeLB);
    if (lbBackdrop) lbBackdrop.addEventListener('click', closeLB);
    if (lbPrev)     lbPrev.addEventListener('click', () => navigate(-1));
    if (lbNext)     lbNext.addEventListener('click', () => navigate(1));
    if (lbZoom)     lbZoom.addEventListener('click', () => lightbox.classList.toggle('zoomed'));
    if (lbImg)      lbImg.addEventListener('click', () => lightbox.classList.toggle('zoomed'));

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLB();
      if (e.key === 'ArrowLeft')   navigate(-1);
      if (e.key === 'ArrowRight')  navigate(1);
    });

    let touchX = 0;
    lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 55) navigate(dx < 0 ? 1 : -1);
    });

    if (btnNormal) {
      btnNormal.addEventListener('click', () => {
        gallery.classList.remove('compact');
        btnNormal.classList.add('active');
        if (btnCompact) btnCompact.classList.remove('active');
      });
    }
    if (btnCompact) {
      btnCompact.addEventListener('click', () => {
        gallery.classList.add('compact');
        btnCompact.classList.add('active');
        if (btnNormal) btnNormal.classList.remove('active');
      });
    }

    window.addEventListener('scroll', () => {
      if (scrollTopB) scrollTopB.classList.toggle('show', window.scrollY > 400);
    }, { passive: true });
    if (scrollTopB) scrollTopB.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    discover();
  </script>
</body>
</html>
