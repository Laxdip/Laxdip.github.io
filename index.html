<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NATURE — Immersive Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN SYSTEM — Ultra Minimal + Bold
    ═══════════════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --bg-card: #0a0a0a;
      --bg-hover: #111111;
      --text: #f5f5f5;
      --text-dim: #555555;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.08);
      --border: rgba(255, 255, 255, 0.04);
      --border-hover: rgba(108, 92, 231, 0.15);
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
      --font: 'Outfit', -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 2px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }

    /* ═══════════════════════════════════════════════════════
       HEADER — Ultra Minimal
    ═══════════════════════════════════════════════════════ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 18px 32px;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header .brand {
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .header .brand span {
      color: var(--text);
      font-weight: 600;
    }

    .header .brand i {
      color: var(--accent);
      margin-right: 8px;
      font-size: 0.7rem;
    }

    /* ═══════════════════════════════════════════════════════
       MAIN — Full Bleed Gallery
    ═══════════════════════════════════════════════════════ */
    .main {
      padding-top: 80px;
      max-width: 1600px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 40px;
    }

    /* ── Gallery Grid ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    /* ── Art Card ── */
    .art-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .art-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .art-card img {
      display: block;
      width: 100%;
      height: auto;
      transition: all 0.5s ease;
      background: var(--bg-card);
    }

    .art-card:hover img {
      filter: brightness(0.85) saturate(1.05);
      transform: scale(1.02);
    }

    /* ── Card Overlay ── */
    .art-card .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 18px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.35s ease;
    }

    .art-card:hover .overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .art-card .overlay .title {
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
    }

    .art-card .overlay .index {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.15);
      font-weight: 200;
      letter-spacing: 0.15em;
    }

    /* ── Placeholder ── */
    .placeholder {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      animation: pulse 1.5s ease-in-out infinite;
      min-height: 200px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* ── Empty State ── */
    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 20px;
      text-align: center;
      gap: 16px;
    }

    .empty .icon {
      width: 60px;
      height: 60px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--text-dim);
    }

    .empty h2 {
      font-weight: 300;
      font-size: 1.2rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .empty p {
      color: var(--text-dim);
      font-size: 0.75rem;
      max-width: 360px;
      line-height: 1.8;
      font-weight: 200;
    }

    .empty code {
      background: var(--bg-card);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.65rem;
      color: var(--accent);
      border: 1px solid var(--border);
      font-family: 'Monaco', monospace;
    }

    /* ═══════════════════════════════════════════════════════
       LIGHTBOX — Immersive Full Screen
    ═══════════════════════════════════════════════════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.97);
      backdrop-filter: blur(60px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 40px;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox .backdrop {
      position: absolute;
      inset: 0;
      cursor: zoom-out;
    }

    /* ── Frame ── */
    .lightbox .frame {
      position: relative;
      z-index: 2;
      max-width: 90vw;
      max-height: 85vh;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.92);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lightbox.open .frame {
      transform: scale(1);
    }

    .lightbox .frame img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.35s ease;
      touch-action: pinch-zoom;
      border-radius: 4px;
    }

    .lightbox .frame img.zoomed {
      transform: scale(1.6);
      cursor: zoom-out;
    }

    /* ── Controls — ALWAYS VISIBLE ── */
    .lb-controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(16px);
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      opacity: 0;
      transition: opacity 0.4s ease 0.3s;
    }

    .lightbox.open .lb-controls {
      opacity: 1;
    }

    .lb-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .lb-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      transform: scale(1.05);
    }

    .lb-btn.close:hover {
      background: rgba(255, 50, 50, 0.08);
      color: #ff6b6b;
    }

    .lb-btn.download:hover {
      background: rgba(108, 92, 231, 0.08);
      color: var(--accent);
    }

    .lb-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.04);
    }

    /* ── Navigation ── */
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
    }

    .lightbox.open .lb-nav {
      opacity: 1;
      pointer-events: all;
    }

    .lb-nav:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      transform: translateY(-50%) scale(1.05);
    }

    .lb-nav.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #lbPrev { left: 24px; }
    #lbNext { right: 24px; }

    /* ── Counter ── */
    .lb-counter {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 5;
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.08);
      letter-spacing: 0.2em;
      font-weight: 200;
      opacity: 0;
      transition: opacity 0.4s ease 0.5s;
    }

    .lightbox.open .lb-counter {
      opacity: 1;
    }

    /* ── Filename ── */
    .lb-filename {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.08);
      letter-spacing: 0.1em;
      font-weight: 200;
      opacity: 0;
      transition: opacity 0.4s ease 0.5s;
    }

    .lightbox.open .lb-filename {
      opacity: 1;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLL TOP
    ═══════════════════════════════════════════════════════ */
    #scrollTop {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      font-size: 0.75rem;
    }

    #scrollTop.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    #scrollTop:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════ */
    @media (max-width: 1024px) {
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 14px 16px;
      }
      
      .header .brand {
        font-size: 0.7rem;
      }
      
      .main {
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 72px;
      }
      
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
      }
      
      .art-card {
        border-radius: 8px;
        min-height: 140px;
      }
      
      .lightbox {
        padding: 16px;
      }
      
      .lightbox .frame {
        max-width: 98vw;
        max-height: 82vh;
      }
      
      .lb-nav {
        width: 36px;
        height: 36px;
        font-size: 0.7rem;
      }
      
      #lbPrev { left: 8px; }
      #lbNext { right: 8px; }
      
      .lb-controls {
        padding: 6px 10px;
        bottom: 20px;
        gap: 4px;
      }
      
      .lb-btn {
        width: 34px;
        height: 34px;
        font-size: 0.75rem;
      }
      
      .lb-counter {
        top: 16px;
        right: 16px;
        font-size: 0.45rem;
      }
      
      .lb-filename {
        bottom: 72px;
        font-size: 0.5rem;
      }
      
      #scrollTop {
        bottom: 16px;
        right: 16px;
        width: 34px;
        height: 34px;
        font-size: 0.65rem;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      
      .art-card {
        border-radius: 6px;
        min-height: 100px;
      }
      
      .art-card .overlay {
        padding: 12px;
      }
      
      .art-card .overlay .title {
        font-size: 0.55rem;
      }
      
      .lb-controls {
        bottom: 14px;
        padding: 4px 8px;
      }
      
      .lb-btn {
        width: 30px;
        height: 30px;
        font-size: 0.65rem;
      }
      
      .lb-divider {
        height: 16px;
      }
    }

    @media (max-width: 380px) {
      .gallery {
        gap: 4px;
      }
      
      .art-card {
        border-radius: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════ -->
  <header class="header">
    <div class="brand">
      <i class="fa-regular fa-compass"></i>
      <span>NATURE</span> ARCHIVE
    </div>
    <div class="brand" style="font-size:0.6rem;color:var(--text-dim);">
      <i class="fa-regular fa-circle" style="color:var(--accent);font-size:0.4rem;"></i>
      <span id="yearDisplay"></span>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       MAIN GALLERY
  ═══════════════════════════════════════════════════════ -->
  <main class="main">
    <div class="gallery" id="gallery"></div>
  </main>

  <!-- ═══════════════════════════════════════════════════════
       SCROLL TOP
  ═══════════════════════════════════════════════════════ -->
  <button id="scrollTop" aria-label="Back to top">
    <i class="fa-regular fa-arrow-up"></i>
  </button>

  <!-- ═══════════════════════════════════════════════════════
       LIGHTBOX
  ═══════════════════════════════════════════════════════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="backdrop" id="lbBackdrop"></div>

    <button class="lb-nav hidden" id="lbPrev" aria-label="Previous">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="lb-nav hidden" id="lbNext" aria-label="Next">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="frame" id="lbFrame">
      <img id="lbImg" src="" alt="" loading="eager" />
    </div>

    <div class="lb-counter" id="lbCounter"></div>
    <div class="lb-filename" id="lbFilename"></div>

    <div class="lb-controls">
      <button class="lb-btn" id="lbZoom" title="Toggle zoom" aria-label="Toggle zoom">
        <i class="fa-regular fa-magnifying-glass-plus"></i>
      </button>
      <span class="lb-divider"></span>
      <a class="lb-btn download" id="lbDownload" title="Download" aria-label="Download" download>
        <i class="fa-regular fa-download"></i>
      </a>
      <span class="lb-divider"></span>
      <button class="lb-btn close" id="lbClose" title="Close" aria-label="Close">
        <i class="fa-regular fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════════════ -->
  <script>
    (() => {
      'use strict';

      // ─── CONFIG ──────────────────────────────────────
      const CONFIG = {
        path: 'images/',
        manifest: 'images/manifest.json',
        formats: ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif'],
      };

      // ─── STATE ──────────────────────────────────────
      let images = [];
      let currentIndex = -1;

      // ─── DOM REFS ──────────────────────────────────
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbBackdrop = document.getElementById('lbBackdrop');
      const lbClose = document.getElementById('lbClose');
      const lbZoom = document.getElementById('lbZoom');
      const lbDownload = document.getElementById('lbDownload');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      const lbFilename = document.getElementById('lbFilename');
      const lbCounter = document.getElementById('lbCounter');
      const scrollTopBtn = document.getElementById('scrollTop');
      const yearDisplay = document.getElementById('yearDisplay');

      // ─── YEAR ──────────────────────────────────────
      yearDisplay.textContent = new Date().getFullYear();

      // ─── HELPERS ────────────────────────────────────
      const prettyName = (name) => name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');

      // ─── DISCOVER IMAGES ──────────────────────────
      async function discoverImages() {
        try {
          const res = await fetch(CONFIG.manifest);
          if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list) && list.length) {
              images = list.map((f) => ({ src: CONFIG.path + f, name: f }));
              renderGallery();
              return;
            }
          }
        } catch (_) {}

        try {
          const res = await fetch(CONFIG.path);
          if (res.ok) {
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const names = [...doc.querySelectorAll('a[href]')]
              .map((a) => a.getAttribute('href'))
              .filter((h) => CONFIG.formats.some((ext) => h.toLowerCase().endsWith(ext)))
              .map((h) => h.split('/').pop());
            if (names.length) {
              images = names.map((f) => ({ src: CONFIG.path + f, name: f }));
              renderGallery();
              return;
            }
          }
        } catch (_) {}

        images = [];
        renderGallery();
      }

      // ─── RENDER GALLERY ────────────────────────────
      function renderGallery() {
        gallery.innerHTML = '';

        if (!images.length) {
          gallery.innerHTML = `
            <div class="empty">
              <div class="icon"><i class="fa-regular fa-image"></i></div>
              <h2>No images found</h2>
              <p>Add images to <code>/images</code> and create<br />
                 <code>images/manifest.json</code> listing them.</p>
            </div>
          `;
          return;
        }

        images.forEach((data, idx) => {
          const card = document.createElement('div');
          card.className = 'art-card';
          card.dataset.index = idx;
          card.setAttribute('role', 'listitem');
          card.setAttribute('tabindex', '0');

          const img = document.createElement('img');
          img.alt = prettyName(data.name);
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = data.src;

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = prettyName(data.name);
          const index = document.createElement('div');
          index.className = 'index';
          index.textContent = `#${idx + 1}`;
          overlay.appendChild(title);
          overlay.appendChild(index);

          card.appendChild(img);
          card.appendChild(overlay);
          gallery.appendChild(card);

          img.addEventListener('error', () => {
            images[idx] = null;
            card.remove();
          });

          card.addEventListener('click', () => openLightbox(idx));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(idx);
            }
          });
        });
      }

      // ─── LIGHTBOX ──────────────────────────────────
      function openLightbox(idx) {
        if (!images[idx]) return;
        currentIndex = idx;

        const data = images[idx];
        lbImg.src = data.src;
        lbImg.alt = prettyName(data.name);
        lbImg.classList.remove('zoomed');
        lbFilename.textContent = data.name;
        lbDownload.href = data.src;
        lbDownload.setAttribute('download', data.name);

        updateCounter();

        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        updateNavButtons();
        setTimeout(() => lbClose.focus(), 100);
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!lightbox.classList.contains('open')) lbImg.src = '';
        }, 400);
        currentIndex = -1;
      }

      function navigateLightbox(dir) {
        let next = currentIndex + dir;
        const max = images.length - 1;
        if (next < 0) next = max;
        if (next > max) next = 0;

        let attempts = 0;
        while (!images[next] && attempts < images.length) {
          next += dir;
          if (next < 0) next = max;
          if (next > max) next = 0;
          attempts++;
        }

        if (images[next]) {
          openLightbox(next);
        }
      }

      function updateCounter() {
        const total = images.filter(Boolean).length;
        if (total <= 1) {
          lbCounter.textContent = '';
        } else {
          lbCounter.textContent = `${currentIndex + 1} / ${total}`;
        }
      }

      function updateNavButtons() {
        const total = images.filter(Boolean).length;
        lbPrev.classList.toggle('hidden', total <= 1);
        lbNext.classList.toggle('hidden', total <= 1);
      }

      // ─── LIGHTBOX EVENTS ──────────────────────────
      lbClose.addEventListener('click', closeLightbox);
      lbBackdrop.addEventListener('click', closeLightbox);
      lbPrev.addEventListener('click', () => navigateLightbox(-1));
      lbNext.addEventListener('click', () => navigateLightbox(1));

      lbZoom.addEventListener('click', () => {
        lbImg.classList.toggle('zoomed');
        const icon = lbZoom.querySelector('i');
        if (lbImg.classList.contains('zoomed')) {
          icon.className = 'fa-regular fa-magnifying-glass-minus';
        } else {
          icon.className = 'fa-regular fa-magnifying-glass-plus';
        }
      });

      lbImg.addEventListener('dblclick', () => lbZoom.click());

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          closeLightbox();
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigateLightbox(-1);
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateLightbox(1);
        }
      });

      // ─── SWIPE ─────────────────────────────────────
      let touchStartX = 0;
      let touchStartY = 0;
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
          navigateLightbox(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // ─── SCROLL TOP ──────────────────────────────
      window.addEventListener('scroll', () => {
        scrollTopBtn.classList.toggle('show', window.scrollY > 400);
      }, { passive: true });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // ─── INIT ──────────────────────────────────────
      discoverImages();

    })();
  </script>
</body>
</html>
