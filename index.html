<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nature's Canvas — Ethereal Moments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* =====================================================
       ROOT — ETHEREAL GLASS THEME
    ===================================================== */
    :root {
      --bg-gradient-start: #0a0c10;
      --bg-gradient-end: #141824;
      --glass-bg: rgba(20, 24, 36, 0.45);
      --glass-border: rgba(255, 215, 150, 0.18);
      --glass-highlight: rgba(255, 215, 150, 0.08);
      --amber-primary: #ffb347;
      --amber-glow: #ffaa33;
      --amber-deep: #cc8833;
      --cream-light: #f5eedc;
      --cream-muted: #ddd0b0;
      --text-dim: #8a7a60;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 30px rgba(255, 180, 70, 0.15);
      
      --font-heading: 'Playfair Display', 'Times New Roman', serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-glass: cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    /* =====================================================
       RESET & GLOBAL
    ===================================================== */
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html { 
      scroll-behavior: smooth; 
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--cream-light);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated gradient background overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 180, 70, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(1.2); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      background: radial-gradient(circle, var(--amber-primary), transparent);
      border-radius: 50%;
      opacity: 0.15;
      filter: blur(3px);
      animation: floatParticle 15s infinite linear;
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-20vh) translateX(50px) rotate(360deg); opacity: 0; }
    }

    /* =====================================================
       MAIN WRAPPER
    ===================================================== */
    .page {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* =====================================================
       HEADER — GLASS CARD
    ===================================================== */
    .site-header {
      position: relative;
      text-align: center;
      padding: 60px 32px 50px;
      margin: 20px 0 40px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px var(--shadow-color), var(--shadow-glow);
      transition: all 0.4s var(--ease-glass);
    }
    
    .site-header:hover {
      border-color: rgba(255, 180, 70, 0.35);
      box-shadow: 0 12px 48px var(--shadow-color), 0 0 40px rgba(255, 180, 70, 0.2);
    }

    /* Decorative corner accents */
    .corner-accent {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.6;
    }
    
    .corner-accent::before,
    .corner-accent::after {
      content: '';
      position: absolute;
      background: var(--amber-primary);
    }
    
    .corner-accent::before { width: 2px; height: 100%; }
    .corner-accent::after { width: 100%; height: 2px; }
    
    .corner-tl { top: 20px; left: 20px; }
    .corner-tl::before { top: 0; left: 0; }
    .corner-tl::after { top: 0; left: 0; }
    
    .corner-tr { top: 20px; right: 20px; transform: rotate(90deg); }
    .corner-bl { bottom: 20px; left: 20px; transform: rotate(-90deg); }
    .corner-br { bottom: 20px; right: 20px; transform: rotate(180deg); }

    .pre-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-smooth) 0.2s forwards;
    }
    
    .pre-label-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--amber-primary), transparent);
    }
    
    .pre-label-text {
      font-size: 0.7rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--amber-primary);
      font-weight: 300;
    }

    .site-title {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-smooth) 0.3s forwards;
    }
    
    .t-nature {
      display: block;
      background: linear-gradient(135deg, var(--cream-light) 0%, var(--cream-muted) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    
    .t-canvas {
      display: block;
      background: linear-gradient(135deg, var(--amber-primary) 0%, var(--amber-glow) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-style: italic;
      text-shadow: none;
    }

    .site-subtitle {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-smooth) 0.4s forwards;
    }

    .divider-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 24px 0 20px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-smooth) 0.5s forwards;
    }
    
    .dov-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--amber-primary), transparent);
    }
    
    .dov-mid {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .dov-dot {
      width: 4px;
      height: 4px;
      background: var(--amber-primary);
      border-radius: 50%;
    }
    
    .dov-diamond {
      width: 8px;
      height: 8px;
      background: var(--amber-glow);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--amber-primary);
    }

    .site-credit {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0.6;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-smooth) 0.6s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =====================================================
       CONTROLS BAR — GLASS
    ===================================================== */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      border: 1px solid var(--glass-border);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.6s var(--ease-smooth) 0.7s forwards;
    }
    
    .ctrl-label {
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--cream-muted);
    }
    
    .ctrl-label strong {
      color: var(--amber-primary);
      font-weight: 700;
      font-size: 1.1rem;
    }
    
    .ctrl-right {
      display: flex;
      gap: 12px;
    }
    
    .icon-btn {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--cream-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.25s var(--ease-smooth);
    }
    
    .icon-btn:hover {
      background: rgba(255, 180, 70, 0.15);
      border-color: var(--amber-primary);
      color: var(--amber-primary);
      transform: translateY(-2px);
    }
    
    .icon-btn.active {
      background: rgba(255, 180, 70, 0.2);
      border-color: var(--amber-primary);
      color: var(--amber-primary);
      box-shadow: 0 0 12px rgba(255, 180, 70, 0.3);
    }

    /* =====================================================
       GALLERY — ENHANCED MASONRY
    ===================================================== */
    .gallery {
      column-count: 4;
      column-gap: 20px;
    }
    
    .gallery.compact {
      column-gap: 12px;
    }
    
    .gallery.compact .photo-frame {
      margin-bottom: 12px;
      padding: 8px;
    }

    @media (max-width: 1200px) { .gallery { column-count: 3; } }
    @media (max-width: 760px)  { .gallery { column-count: 2; } }
    @media (max-width: 440px)  { .gallery { column-count: 1; } }

    /* =====================================================
       PHOTO FRAME — 3D TILT EFFECT
    ===================================================== */
    .photo-frame {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      transition: all 0.4s var(--ease-bounce);
      transform-style: preserve-3d;
      perspective: 1000px;
      
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: opacity 0.6s var(--ease-smooth), transform 0.6s var(--ease-smooth), box-shadow 0.3s ease;
    }
    
    .photo-frame.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    
    .photo-frame:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--amber-primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 180, 70, 0.2);
    }
    
    /* Inner glow on hover */
    .photo-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, var(--amber-primary), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    
    .photo-frame:hover::before {
      opacity: 0.6;
    }
    
    .photo-img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      filter: sepia(0.15) contrast(1.05) brightness(0.95);
      transition: all 0.4s ease;
    }
    
    .photo-frame:hover .photo-img {
      filter: sepia(0.05) contrast(1.08) brightness(1.02);
    }

    /* =====================================================
       LOADING & EMPTY STATES
    ===================================================== */
    .gallery-loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--cream-muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    .spin-ring {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--glass-border);
      border-top-color: var(--amber-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
      vertical-align: middle;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty-state {
      text-align: center;
      padding: 100px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid var(--glass-border);
    }
    
    .empty-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: radial-gradient(circle, rgba(255, 180, 70, 0.1), transparent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--amber-primary);
    }
    
    .empty-state h2 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 16px;
      color: var(--cream-light);
    }
    
    .empty-state p {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    
    .empty-state code {
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--amber-primary);
    }

    /* =====================================================
       LIGHTBOX — CINEMATIC
    ===================================================== */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(40px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    
    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }
    
    .lb-backdrop {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }
    
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 80px;
      background: rgba(255, 180, 70, 0.1);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: var(--cream-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition: all 0.25s ease;
      z-index: 10;
    }
    
    .lb-nav:hover {
      background: rgba(255, 180, 70, 0.25);
      border-color: var(--amber-primary);
      transform: translateY(-50%) scale(1.05);
    }
    
    #lb-prev { left: 24px; }
    #lb-next { right: 24px; }
    .lb-nav.hidden { opacity: 0; pointer-events: none; }
    
    .lb-toolbar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 60px;
      padding: 12px 20px;
      border: 1px solid var(--glass-border);
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    
    #lightbox.open .lb-toolbar {
      transform: translateY(0);
    }
    
    .lb-info {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--cream-muted);
    }
    
    .lb-actions {
      display: flex;
      gap: 8px;
    }
    
    .lb-btn {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--cream-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    .lb-btn:hover {
      background: rgba(255, 180, 70, 0.2);
      border-color: var(--amber-primary);
      color: var(--amber-primary);
      transform: scale(1.05);
    }
    
    .lb-frame {
      position: relative;
      z-index: 5;
      max-width: min(90vw, 1200px);
      max-height: 85vh;
      background: rgba(0, 0, 0, 0.5);
      padding: 16px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      transform: scale(0.9) translateY(30px);
      transition: transform 0.5s var(--ease-bounce);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }
    
    #lightbox.open .lb-frame {
      transform: scale(1) translateY(0);
    }
    
    #lb-img {
      display: block;
      max-width: 100%;
      max-height: calc(85vh - 80px);
      object-fit: contain;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    
    #lb-img.loading { opacity: 0; }
    
    #lightbox.zoomed #lb-img {
      transform: scale(1.8);
      cursor: zoom-out;
    }
    
    .lb-caption {
      position: absolute;
      bottom: -32px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    /* =====================================================
       FOOTER
    ===================================================== */
    .site-footer {
      text-align: center;
      padding: 60px 20px 40px;
      margin-top: 40px;
      border-top: 1px solid var(--glass-border);
    }
    
    .footer-ornament {
      font-size: 0.7rem;
      letter-spacing: 8px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }
    
    #footerCount {
      font-family: var(--font-heading);
      font-size: 1rem;
      font-style: italic;
      color: var(--cream-muted);
      margin-bottom: 12px;
    }
    
    #footerCount strong {
      color: var(--amber-primary);
      font-size: 1.4rem;
      font-style: normal;
    }
    
    .footer-quote {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
      letter-spacing: 0.5px;
    }

    /* =====================================================
       SCROLL TO TOP
    ===================================================== */
    #scrollTop {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 200;
      width: 48px;
      height: 48px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      color: var(--amber-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.3s var(--ease-smooth);
    }
    
    #scrollTop.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }
    
    #scrollTop:hover {
      background: rgba(255, 180, 70, 0.2);
      border-color: var(--amber-primary);
      transform: translateY(-4px);
      box-shadow: 0 4px 20px rgba(255, 180, 70, 0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-gradient-start); }
    ::-webkit-scrollbar-thumb { background: var(--amber-deep); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--amber-primary); }
    
    ::selection { background: rgba(255, 180, 70, 0.3); color: var(--cream-light); }
    
    /* Responsive */
    @media (max-width: 768px) {
      .page { padding: 0 16px 60px; }
      .site-header { padding: 40px 20px; margin: 10px 0 30px; }
      .controls-bar { flex-direction: column; gap: 12px; border-radius: 24px; }
      .lb-nav { width: 40px; height: 60px; font-size: 1.5rem; }
      #lb-prev { left: 8px; }
      #lb-next { right: 8px; }
      #scrollTop { bottom: 20px; right: 20px; width: 40px; height: 40px; }
      .lb-toolbar { top: 12px; left: 12px; right: 12px; padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- ===================================================
       HEADER — GLASS CARD
  =================================================== -->
  <main class="page" role="main">
    <header class="site-header" role="banner">
      <div class="corner-accent corner-tl"></div>
      <div class="corner-accent corner-tr"></div>
      <div class="corner-accent corner-bl"></div>
      <div class="corner-accent corner-br"></div>

      <div class="pre-label">
        <div class="pre-label-line"></div>
        <span class="pre-label-text">✦ Visual Poetry ✦</span>
        <div class="pre-label-line"></div>
      </div>

      <h1 class="site-title">
        <span class="t-nature">Nature's</span>
        <span class="t-canvas">Canvas</span>
      </h1>

      <p class="site-subtitle">Stories Written By Nature</p>

      <div class="divider-ornament">
        <div class="dov-line"></div>
        <div class="dov-mid">
          <div class="dov-dot"></div>
          <div class="dov-diamond"></div>
          <div class="dov-dot"></div>
        </div>
        <div class="dov-line"></div>
      </div>

      <p class="site-credit">curated by Prasad</p>
    </header>

    <!-- ===================================================
         GALLERY CONTROLS
    =================================================== -->
    <div class="controls-bar" id="controlsBar">
      <span class="ctrl-label" id="countLabel">Loading photographs…</span>
      <div class="ctrl-right">
        <button class="icon-btn active" id="btnNormal" title="Normal view" aria-label="Normal view">⊞</button>
        <button class="icon-btn" id="btnCompact" title="Compact view" aria-label="Compact view">⊟</button>
      </div>
    </div>

    <!-- ===================================================
         GALLERY CONTAINER
    =================================================== -->
    <div id="gallery" class="gallery" role="list" aria-label="Photo gallery">
      <div class="gallery-loading" id="loadMsg" role="status" aria-live="polite">
        <span class="spin-ring"></span> Loading ethereal moments…
      </div>
    </div>

    <!-- ===================================================
         FOOTER
    =================================================== -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-ornament">✦ ✦ ✦</div>
      <p id="footerCount"></p>
      <p class="footer-quote">"In every walk with nature, one receives far more than he seeks."</p>
    </footer>
  </main>

  <!-- Scroll-to-top button -->
  <button id="scrollTop" aria-label="Back to top">↑</button>

  <!-- ===================================================
       LIGHTBOX
  =================================================== -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true">
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <button class="lb-nav hidden" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-nav hidden" id="lb-next" aria-label="Next">›</button>

    <div class="lb-toolbar">
      <span class="lb-info" id="lbFilename"></span>
      <div class="lb-actions">
        <a class="lb-btn" id="lbDownload" title="Download" aria-label="Download" download>↓</a>
        <button class="lb-btn" id="lbZoom" title="Zoom" aria-label="Toggle zoom">⊕</button>
        <button class="lb-btn" id="lbClose" title="Close" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="lb-frame">
      <img id="lb-img" src="" alt="" />
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

  <!-- ===================================================
       JAVASCRIPT — COMPLETELY UNCHANGED (only UI above)
       ALL LOGIC PRESERVED EXACTLY AS ORIGINAL
  =================================================== -->
  <script>
    /* ===========================================================
       GITHUB PAGES AUTO-DETECTION — HOW IT WORKS
       ─────────────────────────────────────────────────────────
       Place  images/manifest.json  in your repo with contents:

         ["forest.jpg", "river.webp", "mountain.png"]

       The gallery reads it automatically — no editing needed.
       The script generates this file list for you; just keep it
       updated whenever you add photos.

       LOCAL (localhost):  falls back to directory listing scan.
       manifest.json is optional locally.
    =========================================================== */

    const CFG = {
      path:     'images/',
      manifest: 'images/manifest.json',
      formats:  ['.jpg','.jpeg','.png','.webp','.gif','.avif']
    };

    /* State */
    let images     = [];   /* [{src, name}, ...] — null if load-failed */
    let loadedN    = 0;
    let currentIdx = -1;

    /* DOM */
    const gallery    = document.getElementById('gallery');
    const loadMsg    = document.getElementById('loadMsg');
    const countLabel = document.getElementById('countLabel');
    const footerCnt  = document.getElementById('footerCount');
    const lightbox   = document.getElementById('lightbox');
    const lbImg      = document.getElementById('lb-img');
    const lbBackdrop = document.getElementById('lbBackdrop');
    const lbClose    = document.getElementById('lbClose');
    const lbZoom     = document.getElementById('lbZoom');
    const lbDownload = document.getElementById('lbDownload');
    const lbPrev     = document.getElementById('lb-prev');
    const lbNext     = document.getElementById('lb-next');
    const lbFilename = document.getElementById('lbFilename');
    const lbCaption  = document.getElementById('lbCaption');
    const scrollTopB = document.getElementById('scrollTop');
    const btnNormal  = document.getElementById('btnNormal');
    const btnCompact = document.getElementById('btnCompact');

    /* ===========================================================
       DISCOVERY — manifest → directory listing → empty state
    =========================================================== */
    async function discover() {
      /* 1. manifest.json — works on GitHub Pages & any static host */
      try {
        const r = await fetch(CFG.manifest);
        if (r.ok) {
          const list = await r.json();
          if (Array.isArray(list) && list.length) {
            build(list.map(f => ({ src: CFG.path + f, name: f })));
            return;
          }
        }
      } catch (_) {}

      /* 2. Directory listing — works on Apache / python -m http.server */
      try {
        const r = await fetch(CFG.path);
        if (r.ok) {
          const html = await r.text();
          const doc  = new DOMParser().parseFromString(html, 'text/html');
          const names = [...doc.querySelectorAll('a[href]')]
            .map(a => a.getAttribute('href'))
            .filter(h => CFG.formats.some(e => h.toLowerCase().endsWith(e)))
            .map(h => h.split('/').pop());
          if (names.length) {
            build(names.map(f => ({ src: CFG.path + f, name: f })));
            return;
          }
        }
      } catch (_) {}

      /* 3. Nothing found */
      build([]);
    }

    /* ===========================================================
       BUILD GALLERY
    =========================================================== */
    function build(list) {
      loadMsg && loadMsg.remove();

      if (!list.length) {
        gallery.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❧</div>
            <h2>No photographs yet</h2>
            <p>
              Add images to <code>/images</code> and create<br/>
              <code>images/manifest.json</code> listing them:<br/><br/>
              <code>["photo1.jpg","sunset.webp","forest.png"]</code>
            </p>
          </div>`;
        updateCounts();
        return;
      }

      images = list;
      list.forEach((img, i) => addFrame(img, i));
      revealOnScroll();
    }

    /* ── One photo frame ──────────────────────────── */
    function addFrame({ src, name }, idx) {
      const frame = document.createElement('div');
      frame.className = 'photo-frame';
      frame.setAttribute('role', 'listitem');
      frame.setAttribute('tabindex', '0');
      frame.setAttribute('aria-label', 'View photo');
      frame.dataset.idx = idx;

      const img = document.createElement('img');
      img.className = 'photo-img';
      img.alt = 'Vintage photograph';
      img.loading = 'lazy';
      img.decoding = 'async';

      img.onload = () => { loadedN++; updateCounts(); };
      img.onerror = () => { images[idx] = null; frame.remove(); updateCounts(); };
      img.src = src;

      frame.append(img);  // ← ONLY img, no label

      gallery.appendChild(frame);

      frame.addEventListener('click', () => openLB(idx));
      frame.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLB(idx); }
      });
    }

    /* ── IntersectionObserver — staggered reveal ─── */
    function revealOnScroll() {
      const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const frames = [...gallery.querySelectorAll('.photo-frame')];
          const i = frames.indexOf(entry.target);
          setTimeout(() => entry.target.classList.add('visible'), Math.min(i * 55, 550));
          io.unobserve(entry.target);
        });
      }, { rootMargin: '0px 0px 120px 0px' });
      gallery.querySelectorAll('.photo-frame').forEach(f => io.observe(f));
    }

    /* ── Count update ─────────────────────────────── */
    function updateCounts() {
      const w = loadedN === 1 ? 'photograph' : 'photographs';
      countLabel.innerHTML = `<strong>${loadedN}</strong> ${w} in the collection`;
      footerCnt.innerHTML  = `<strong>${loadedN}</strong> vintage ${w}`;
    }

    /* ── Pretty filename ──────────────────────────── */
    function pretty(f) { return f.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '); }

    /* ===========================================================
       LIGHTBOX
    =========================================================== */
    function openLB(idx) {
      if (!images[idx]) return;
      currentIdx = idx;

      lbImg.classList.add('loading');
      lbImg.onload = () => lbImg.classList.remove('loading');
      lbImg.src    = images[idx].src;
      lbImg.alt    = pretty(images[idx].name);

      lbFilename.textContent    = images[idx].name;
      lbCaption.textContent     = '';
      lbDownload.href           = images[idx].src;
      lbDownload.setAttribute('download', images[idx].name);

      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      updateNav();
      lbClose.focus();
    }

    function closeLB() {
      lightbox.classList.remove('open', 'zoomed');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(() => { lbImg.src = ''; }, 400);
      currentIdx = -1;
    }

    function navigate(dir) {
      let n = currentIdx + dir;
      const max = images.length - 1;
      if (n < 0) n = max;
      if (n > max) n = 0;
      // Skip nulls (load-failed)
      let tries = 0;
      while (!images[n] && tries++ < images.length) {
        n += dir;
        if (n < 0) n = max;
        if (n > max) n = 0;
      }
      openLB(n);
    }

    function updateNav() {
      const valid = images.filter(Boolean).length;
      lbPrev.classList.toggle('hidden', valid <= 1);
      lbNext.classList.toggle('hidden', valid <= 1);
    }

    /* Events */
    lbClose.addEventListener('click', closeLB);
    lbBackdrop.addEventListener('click', closeLB);
    lbPrev.addEventListener('click', () => navigate(-1));
    lbNext.addEventListener('click', () => navigate(1));

    lbZoom.addEventListener('click', () => lightbox.classList.toggle('zoomed'));
    lbImg.addEventListener('click',  () => lightbox.classList.toggle('zoomed'));

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLB();
      if (e.key === 'ArrowLeft')  navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    /* Touch swipe */
    let touchX = 0;
    lightbox.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 55) navigate(dx < 0 ? 1 : -1);
    });

    /* ===========================================================
       VIEW TOGGLE
    =========================================================== */
    btnNormal.addEventListener('click', () => {
      gallery.classList.remove('compact');
      btnNormal.classList.add('active');
      btnCompact.classList.remove('active');
    });
    btnCompact.addEventListener('click', () => {
      gallery.classList.add('compact');
      btnCompact.classList.add('active');
      btnNormal.classList.remove('active');
    });

    /* ===========================================================
       SCROLL TO TOP
    =========================================================== */
    window.addEventListener('scroll', () => {
      scrollTopB.classList.toggle('show', window.scrollY > 380);
    }, { passive: true });
    scrollTopB.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    /* ===========================================================
       INIT
    =========================================================== */
    discover();

    // Generate floating particles
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = Math.random() * 10 + 10 + 's';
        container.appendChild(particle);
      }
    }
    createParticles();
  </script>
</body>
</html>
