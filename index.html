<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WILD — Visual Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN SYSTEM — Brutalist + Neon
    ═══════════════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #161616;
      --bg-hover: #1e1e1e;
      
      --neon-green: #00ff41;
      --neon-blue: #00d4ff;
      --neon-purple: #b026ff;
      --neon-pink: #ff2d75;
      --neon-orange: #ff6b00;
      
      --text-primary: #f0f0f0;
      --text-secondary: #888888;
      --text-muted: #444444;
      
      --border-color: #222222;
      --border-hover: #333333;
      
      --font-display: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
      
      --shadow-neon: 0 0 30px rgba(0, 255, 65, 0.05);
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.8);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--neon-green);
      border-radius: 10px;
    }

    /* ═══════════════════════════════════════════════════════
       HEADER — Minimal & Bold
    ═══════════════════════════════════════════════════════ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 16px 32px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 255, 65, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .header-brand .accent {
      color: var(--neon-green);
    }

    .header-brand .dot {
      width: 6px;
      height: 6px;
      background: var(--neon-green);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .header-stats .stat-number {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .header-stats .stat-divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
    }

    /* ═══════════════════════════════════════════════════════
       MAIN GRID — Masonry with instant loading
    ═══════════════════════════════════════════════════════ */
    .main {
      padding-top: 80px;
      max-width: 1600px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 60px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    /* ── Photo Card ── */
    .photo-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      aspect-ratio: auto;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon-green);
      box-shadow: var(--shadow-neon), var(--shadow-card);
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.4s ease, filter 0.4s ease;
      background: var(--bg-card);
    }

    .photo-card:hover img {
      transform: scale(1.02);
      filter: brightness(0.85) saturate(1.1);
    }

    /* ── Card Overlay ── */
    .photo-card .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .photo-card:hover .overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-card .overlay .title {
      font-size: 0.65rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .photo-card .overlay .index {
      font-size: 0.5rem;
      color: var(--neon-green);
      opacity: 0.4;
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    /* ── Loading Placeholder ── */
    .placeholder {
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      animation: shimmer 1.8s ease-in-out infinite;
      background: linear-gradient(90deg, 
        var(--bg-card) 25%, 
        var(--bg-hover) 50%, 
        var(--bg-card) 75%
      );
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ── Empty State ── */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      text-align: center;
      gap: 16px;
    }

    .empty-state .icon {
      width: 64px;
      height: 64px;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--text-muted);
    }

    .empty-state h2 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.4rem;
      color: var(--text-secondary);
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.85rem;
      max-width: 400px;
      line-height: 1.6;
    }

    .empty-state code {
      background: var(--bg-card);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--neon-green);
      border: 1px solid var(--border-color);
    }

    /* ═══════════════════════════════════════════════════════
       LIGHTBOX — Full screen minimal
    ═══════════════════════════════════════════════════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox .backdrop {
      position: absolute;
      inset: 0;
      cursor: zoom-out;
    }

    .lightbox .frame {
      position: relative;
      z-index: 2;
      max-width: 90vw;
      max-height: 85vh;
      background: var(--bg-primary);
      border: 1px solid rgba(0, 255, 65, 0.08);
      border-radius: 4px;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lightbox.open .frame {
      transform: scale(1);
    }

    .lightbox .frame img {
      display: block;
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
      touch-action: pinch-zoom;
    }

    .lightbox .frame img.zoomed {
      transform: scale(1.8);
      cursor: zoom-out;
    }

    /* ── Lightbox Controls ── */
    .lb-controls {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(-100%);
      transition: all 0.3s ease;
    }

    .lightbox.open .lb-controls {
      opacity: 1;
      transform: translateY(0);
    }

    .lb-controls .info {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.05em;
      font-weight: 300;
    }

    .lb-controls .actions {
      display: flex;
      gap: 4px;
    }

    .lb-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .lb-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .lb-btn.close:hover {
      background: rgba(255, 50, 50, 0.1);
      color: #ff6b6b;
    }

    /* ── Navigation ── */
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .lightbox.open .lb-nav {
      opacity: 1;
      pointer-events: all;
    }

    .lb-nav:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(0, 255, 65, 0.1);
      color: #fff;
    }

    .lb-nav.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #lbPrev { left: 16px; }
    #lbNext { right: 16px; }

    /* ── Counter ── */
    .lb-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.1);
      letter-spacing: 0.15em;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 14px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .lightbox.open .lb-counter {
      opacity: 1;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLL TOP
    ═══════════════════════════════════════════════════════ */
    #scrollTop {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      font-size: 0.8rem;
    }

    #scrollTop.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    #scrollTop:hover {
      border-color: var(--neon-green);
      color: var(--neon-green);
      transform: translateY(-2px);
    }

    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════ */
    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }
      
      .header-brand {
        font-size: 1rem;
      }
      
      .header-stats {
        gap: 12px;
        font-size: 0.6rem;
      }
      
      .header-stats .stat-divider {
        display: none;
      }
      
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
      }
      
      .main {
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 72px;
      }
      
      .lb-nav {
        width: 36px;
        height: 36px;
        font-size: 0.7rem;
      }
      
      #lbPrev { left: 8px; }
      #lbNext { right: 8px; }
      
      .lb-controls {
        padding: 12px 14px;
      }
      
      .lb-btn {
        width: 32px;
        height: 32px;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      
      .header-brand .dot {
        width: 4px;
        height: 4px;
      }
      
      .photo-card {
        border-radius: 4px;
      }
      
      .photo-card .overlay .title {
        font-size: 0.5rem;
      }
    }

    /* ═══════════════════════════════════════════════════════
       FOOTER
    ═══════════════════════════════════════════════════════ */
    .footer {
      margin-top: 40px;
      padding: 32px 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .footer p {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      font-weight: 300;
    }

    .footer .neon-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--neon-green);
      border-radius: 50%;
      margin: 0 8px;
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════ -->
  <header class="header">
    <div class="header-brand">
      <span class="dot"></span>
      <span>WILD<span class="accent">.</span></span>
    </div>
    <div class="header-stats">
      <span>
        <span class="stat-number" id="headerCount">0</span>
        <span style="color:var(--text-muted);margin-left:4px;">images</span>
      </span>
      <span class="stat-divider"></span>
      <span style="color:var(--text-muted);">
        <i class="fa-regular fa-compass" style="font-size:0.6rem;margin-right:4px;"></i>
        <span id="yearDisplay"></span>
      </span>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       MAIN
  ═══════════════════════════════════════════════════════ -->
  <main class="main">
    <div class="gallery-grid" id="gallery"></div>
  </main>

  <!-- ═══════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════ -->
  <footer class="footer">
    <p>
      <span class="neon-dot"></span>
      <span id="footerCount">0</span> photographs
      <span class="neon-dot"></span>
      curated with purpose
    </p>
  </footer>

  <!-- ═══════════════════════════════════════════════════════
       SCROLL TOP
  ═══════════════════════════════════════════════════════ -->
  <button id="scrollTop" aria-label="Back to top">
    <i class="fa-regular fa-arrow-up"></i>
  </button>

  <!-- ═══════════════════════════════════════════════════════
       LIGHTBOX
  ═══════════════════════════════════════════════════════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="backdrop" id="lbBackdrop"></div>

    <button class="lb-nav hidden" id="lbPrev" aria-label="Previous">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="lb-nav hidden" id="lbNext" aria-label="Next">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="frame" id="lbFrame">
      <img id="lbImg" src="" alt="" loading="eager" />
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <div class="lb-controls">
      <span class="info" id="lbFilename"></span>
      <div class="actions">
        <a class="lb-btn" id="lbDownload" title="Download" download>
          <i class="fa-regular fa-download"></i>
        </a>
        <button class="lb-btn" id="lbZoom" title="Toggle zoom">
          <i class="fa-regular fa-magnifying-glass-plus"></i>
        </button>
        <button class="lb-btn close" id="lbClose" title="Close">
          <i class="fa-regular fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       JAVASCRIPT — Instant Load All Images
  ═══════════════════════════════════════════════════════ -->
  <script>
    (() => {
      'use strict';

      // ─── CONFIG ──────────────────────────────────────
      const CONFIG = {
        path: 'images/',
        manifest: 'images/manifest.json',
        formats: ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif', '.bmp', '.tiff', '.svg'],
      };

      // ─── STATE ──────────────────────────────────────
      let images = [];
      let loadedCount = 0;
      let currentIndex = -1;
      let isLightboxOpen = false;

      // ─── DOM REFS ──────────────────────────────────
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbBackdrop = document.getElementById('lbBackdrop');
      const lbClose = document.getElementById('lbClose');
      const lbZoom = document.getElementById('lbZoom');
      const lbDownload = document.getElementById('lbDownload');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      const lbFilename = document.getElementById('lbFilename');
      const lbCounter = document.getElementById('lbCounter');
      const scrollTopBtn = document.getElementById('scrollTop');
      const headerCount = document.getElementById('headerCount');
      const footerCount = document.getElementById('footerCount');
      const yearDisplay = document.getElementById('yearDisplay');

      // ─── YEAR ──────────────────────────────────────
      yearDisplay.textContent = new Date().getFullYear();

      // ─── HELPERS ────────────────────────────────────
      const prettyName = (name) => name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');

      function updateCounts() {
        const count = images.filter(Boolean).length;
        headerCount.textContent = count;
        footerCount.textContent = count;
      }

      // ─── DISCOVER IMAGES ──────────────────────────
      async function discoverImages() {
        // Try manifest first
        try {
          const res = await fetch(CONFIG.manifest);
          if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list) && list.length) {
              images = list.map((f) => ({ src: CONFIG.path + f, name: f }));
              renderAllImages();
              return;
            }
          }
        } catch (_) {}

        // Try directory listing
        try {
          const res = await fetch(CONFIG.path);
          if (res.ok) {
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const names = [...doc.querySelectorAll('a[href]')]
              .map((a) => a.getAttribute('href'))
              .filter((h) => CONFIG.formats.some((ext) => h.toLowerCase().endsWith(ext)))
              .map((h) => h.split('/').pop());
            if (names.length) {
              images = names.map((f) => ({ src: CONFIG.path + f, name: f }));
              renderAllImages();
              return;
            }
          }
        } catch (_) {}

        // Empty
        images = [];
        renderAllImages();
      }

      // ─── RENDER ALL IMAGES — INSTANT ──────────────
      function renderAllImages() {
        gallery.innerHTML = '';

        if (!images.length) {
          gallery.innerHTML = `
            <div class="empty-state">
              <div class="icon"><i class="fa-regular fa-image"></i></div>
              <h2>No images found</h2>
              <p>Add images to <code>/images</code> and create<br />
                 <code>images/manifest.json</code> listing all filenames.</p>
            </div>
          `;
          updateCounts();
          return;
        }

        // Render ALL images immediately (no lazy loading, no skeletons)
        images.forEach((data, idx) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.dataset.index = idx;
          card.setAttribute('role', 'listitem');
          card.setAttribute('tabindex', '0');

          const img = document.createElement('img');
          img.alt = prettyName(data.name);
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = data.src;

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = prettyName(data.name);
          const index = document.createElement('div');
          index.className = 'index';
          index.textContent = `#${idx + 1}`;
          overlay.appendChild(title);
          overlay.appendChild(index);

          card.appendChild(img);
          card.appendChild(overlay);
          gallery.appendChild(card);

          // Track load
          img.addEventListener('load', () => {
            loadedCount++;
            updateCounts();
          });

          img.addEventListener('error', () => {
            images[idx] = null;
            card.remove();
            updateCounts();
          });

          // Click to open lightbox
          card.addEventListener('click', () => openLightbox(idx));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(idx);
            }
          });
        });

        updateCounts();
      }

      // ─── LIGHTBOX ──────────────────────────────────
      function openLightbox(idx) {
        if (!images[idx]) return;
        currentIndex = idx;
        isLightboxOpen = true;

        const data = images[idx];
        lbImg.src = data.src;
        lbImg.alt = prettyName(data.name);
        lbImg.classList.remove('zoomed');
        lbFilename.textContent = data.name;
        lbDownload.href = data.src;
        lbDownload.setAttribute('download', data.name);

        updateCounter();

        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        updateNavButtons();
        setTimeout(() => lbClose.focus(), 100);
      }

      function closeLightbox() {
        isLightboxOpen = false;
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!isLightboxOpen) lbImg.src = '';
        }, 400);
        currentIndex = -1;
      }

      function navigateLightbox(dir) {
        let next = currentIndex + dir;
        const max = images.length - 1;
        if (next < 0) next = max;
        if (next > max) next = 0;

        let attempts = 0;
        while (!images[next] && attempts < images.length) {
          next += dir;
          if (next < 0) next = max;
          if (next > max) next = 0;
          attempts++;
        }

        if (images[next]) {
          openLightbox(next);
        }
      }

      function updateCounter() {
        const total = images.filter(Boolean).length;
        if (total <= 1) {
          lbCounter.textContent = '';
        } else {
          lbCounter.textContent = `${currentIndex + 1} / ${total}`;
        }
      }

      function updateNavButtons() {
        const total = images.filter(Boolean).length;
        lbPrev.classList.toggle('hidden', total <= 1);
        lbNext.classList.toggle('hidden', total <= 1);
      }

      // ─── LIGHTBOX EVENTS ──────────────────────────
      lbClose.addEventListener('click', closeLightbox);
      lbBackdrop.addEventListener('click', closeLightbox);
      lbPrev.addEventListener('click', () => navigateLightbox(-1));
      lbNext.addEventListener('click', () => navigateLightbox(1));

      lbZoom.addEventListener('click', () => {
        lbImg.classList.toggle('zoomed');
        const icon = lbZoom.querySelector('i');
        if (lbImg.classList.contains('zoomed')) {
          icon.className = 'fa-regular fa-magnifying-glass-minus';
        } else {
          icon.className = 'fa-regular fa-magnifying-glass-plus';
        }
      });

      lbImg.addEventListener('dblclick', () => lbZoom.click());

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          closeLightbox();
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigateLightbox(-1);
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateLightbox(1);
        }
      });

      // Swipe
      let touchStartX = 0;
      let touchStartY = 0;
      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
          navigateLightbox(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // ─── SCROLL TO TOP ────────────────────────────
      window.addEventListener('scroll', () => {
        scrollTopBtn.classList.toggle('show', window.scrollY > 400);
      }, { passive: true });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // ─── INIT ──────────────────────────────────────
      discoverImages();

    })();
  </script>
</body>
</html>
