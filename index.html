<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 10px; }

    /* ─── HEADER ─── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .header h1 span {
      color: #fff;
      font-weight: 500;
    }

    .header .year {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.15);
      font-weight: 300;
    }

    /* ─── GALLERY ─── */
    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      background: #111;
    }

    .card .info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover .info {
      opacity: 1;
    }

    .card .info .name {
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
    }

    .card .info .num {
      font-size: 0.5rem;
      color: rgba(255,255,255,0.2);
      font-weight: 300;
    }

    /* ─── EMPTY ─── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }

    .empty .icon {
      font-size: 2rem;
      color: rgba(255,255,255,0.05);
      margin-bottom: 16px;
    }

    .empty h2 {
      font-weight: 300;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
    }

    .empty p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.08);
      margin-top: 8px;
    }

    .empty code {
      background: rgba(255,255,255,0.03);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      border: 1px solid rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.2);
    }

    /* ─── LOADING ─── */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.05);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* ═══════════════════════════════════════════════════════
       LIGHTBOX — AUTO-ADJUSTING FRAME
    ═══════════════════════════════════════════════════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(40px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 80px 40px 100px;
    }

    .lightbox.open {
      display: flex;
    }

    /* ── Click backdrop to close ── */
    .lightbox .backdrop {
      position: absolute;
      inset: 0;
      cursor: zoom-out;
    }

    /* ── FRAME — auto-sizes to image ── */
    .lightbox .frame {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
      max-height: 80vh;
      background: transparent;
    }

    .lightbox .frame img {
      display: block;
      max-width: 90vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      transition: transform 0.3s ease;
      background: transparent;
    }

    .lightbox .frame img.zoomed {
      transform: scale(1.6);
      cursor: zoom-out;
    }

    /* ─── CONTROLS — OUTSIDE THE IMAGE ─── */
    .lb-controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .lb-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .lb-btn:hover {
      background: rgba(255,255,255,0.04);
      color: #fff;
    }

    .lb-btn.close-btn:hover {
      background: rgba(255,50,50,0.08);
      color: #ff6b6b;
    }

    .lb-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.04);
    }

    /* ─── NAVIGATION ─── */
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .lb-nav:hover {
      background: rgba(255,255,255,0.04);
      color: #fff;
    }

    .lb-nav.hidden {
      display: none;
    }

    #lbPrev { left: 24px; }
    #lbNext { right: 24px; }

    /* ─── INFO ─── */
    .lb-info {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.06);
      letter-spacing: 0.08em;
      font-weight: 300;
    }

    .lb-info .counter {
      color: rgba(255,255,255,0.06);
    }

    .lb-info .filename {
      color: rgba(255,255,255,0.04);
    }

    /* ─── SCROLL TOP ─── */
    #scrollTop {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: all 0.2s ease;
    }

    #scrollTop.show {
      display: flex;
    }

    #scrollTop:hover {
      border-color: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .header { padding: 12px 16px; }
      .header h1 { font-size: 0.7rem; }
      
      .gallery { 
        padding: 16px 12px 40px; 
        gap: 10px; 
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
      }
      
      .lightbox { padding: 60px 16px 80px; }
      
      .lb-nav { 
        width: 36px; 
        height: 36px; 
        font-size: 0.7rem; 
      }
      
      #lbPrev { left: 8px; }
      #lbNext { right: 8px; }
      
      .lb-controls { 
        padding: 6px 10px; 
        bottom: 16px; 
        gap: 4px; 
      }
      
      .lb-btn { 
        width: 34px; 
        height: 34px; 
        font-size: 0.75rem; 
      }
      
      .lb-info {
        bottom: 68px;
        font-size: 0.5rem;
        gap: 12px;
        flex-direction: column;
        gap: 4px;
      }
      
      #scrollTop { 
        bottom: 16px; 
        right: 16px; 
        width: 34px; 
        height: 34px; 
        font-size: 0.65rem; 
      }
    }

    @media (max-width: 480px) {
      .gallery { 
        grid-template-columns: repeat(2, 1fr); 
        gap: 6px; 
        padding: 12px 8px 32px; 
      }
      
      .card { border-radius: 6px; }
      .card .info { padding: 10px; }
      .card .info .name { font-size: 0.55rem; }
      
      .lightbox { padding: 40px 8px 72px; }
      .lightbox .frame img { max-width: 95vw; max-height: 70vh; }
    }
  </style>
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header class="header">
    <h1><span>⟡</span> GALLERY</h1>
    <span class="year" id="year"></span>
  </header>

  <!-- ─── GALLERY ─── -->
  <div class="gallery" id="gallery">
    <div class="loading">loading photographs...</div>
  </div>

  <!-- ─── SCROLL TOP ─── -->
  <button id="scrollTop"><i class="fa-regular fa-arrow-up"></i></button>

  <!-- ═══════════════════════════════════════════════════════
       LIGHTBOX — AUTO-ADJUSTING
  ═══════════════════════════════════════════════════════ -->
  <div class="lightbox" id="lightbox">
    <!-- Backdrop to close -->
    <div class="backdrop" id="backdrop"></div>

    <!-- Navigation -->
    <button class="lb-nav hidden" id="lbPrev"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="lb-nav hidden" id="lbNext"><i class="fa-solid fa-chevron-right"></i></button>

    <!-- Frame — auto-sizes to image -->
    <div class="frame" id="frame">
      <img id="lbImg" src="" alt="" />
    </div>

    <!-- Info below image -->
    <div class="lb-info" id="lbInfo">
      <span class="filename" id="lbFilename"></span>
      <span class="counter" id="lbCounter"></span>
    </div>

    <!-- Controls — always visible, outside image -->
    <div class="lb-controls">
      <button class="lb-btn" id="lbZoom"><i class="fa-regular fa-magnifying-glass-plus"></i></button>
      <span class="lb-divider"></span>
      <a class="lb-btn" id="lbDownload" download><i class="fa-regular fa-download"></i></a>
      <span class="lb-divider"></span>
      <button class="lb-btn close-btn" id="lbClose"><i class="fa-regular fa-xmark"></i></button>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ─── CONFIG ──────────────────────────────────
      const PATH = 'images/';
      const MANIFEST = 'images/manifest.json';
      const FORMATS = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif'];

      // ─── STATE ──────────────────────────────────
      let images = [];
      let currentIndex = -1;

      // ─── DOM ─────────────────────────────────────
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const backdrop = document.getElementById('backdrop');
      const lbClose = document.getElementById('lbClose');
      const lbZoom = document.getElementById('lbZoom');
      const lbDownload = document.getElementById('lbDownload');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      const lbFilename = document.getElementById('lbFilename');
      const lbCounter = document.getElementById('lbCounter');
      const scrollTop = document.getElementById('scrollTop');
      const yearEl = document.getElementById('year');

      // ─── YEAR ────────────────────────────────────
      yearEl.textContent = new Date().getFullYear();

      // ─── HELPERS ────────────────────────────────
      function cleanName(name) {
        return name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      }

      // ─── LOAD IMAGES ────────────────────────────
      async function loadImages() {
        try {
          const res = await fetch(MANIFEST);
          if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list) && list.length) {
              images = list.map(f => ({ src: PATH + f, name: f }));
              render();
              return;
            }
          }
        } catch (_) {}

        try {
          const res = await fetch(PATH);
          if (res.ok) {
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const names = [...doc.querySelectorAll('a[href]')]
              .map(a => a.getAttribute('href'))
              .filter(h => FORMATS.some(ext => h.toLowerCase().endsWith(ext)))
              .map(h => h.split('/').pop());
            if (names.length) {
              images = names.map(f => ({ src: PATH + f, name: f }));
              render();
              return;
            }
          }
        } catch (_) {}

        images = [];
        render();
      }

      // ─── RENDER ──────────────────────────────────
      function render() {
        gallery.innerHTML = '';

        if (!images.length) {
          gallery.innerHTML = `
            <div class="empty">
              <div class="icon"><i class="fa-regular fa-image"></i></div>
              <h2>No images found</h2>
              <p>Add images to <code>/images</code> and create<br /><code>images/manifest.json</code></p>
            </div>
          `;
          return;
        }

        images.forEach((data, i) => {
          const card = document.createElement('div');
          card.className = 'card';

          const img = document.createElement('img');
          img.src = data.src;
          img.alt = cleanName(data.name);
          img.loading = 'lazy';

          const info = document.createElement('div');
          info.className = 'info';
          info.innerHTML = `
            <div class="name">${cleanName(data.name)}</div>
            <div class="num">#${i + 1}</div>
          `;

          card.appendChild(img);
          card.appendChild(info);
          gallery.appendChild(card);

          card.addEventListener('click', () => openLightbox(i));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(i);
            }
          });
          card.setAttribute('tabindex', '0');
          card.setAttribute('role', 'button');

          img.addEventListener('error', () => {
            images[i] = null;
            card.remove();
          });
        });
      }

      // ─── LIGHTBOX ────────────────────────────────
      function openLightbox(index) {
        if (!images[index]) return;
        currentIndex = index;

        const data = images[index];
        
        // Reset zoom state
        lbImg.classList.remove('zoomed');
        const zoomIcon = lbZoom.querySelector('i');
        zoomIcon.className = 'fa-regular fa-magnifying-glass-plus';
        
        // Set image
        lbImg.src = data.src;
        lbImg.alt = cleanName(data.name);
        
        // Update info
        lbFilename.textContent = data.name;
        lbDownload.href = data.src;
        lbDownload.setAttribute('download', data.name);

        updateCounter();
        updateNav();

        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
        setTimeout(() => lbClose.focus(), 100);
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        setTimeout(() => {
          if (!lightbox.classList.contains('open')) {
            lbImg.src = '';
          }
        }, 400);
        currentIndex = -1;
      }

      function navigate(dir) {
        let next = currentIndex + dir;
        const max = images.length - 1;
        if (next < 0) next = max;
        if (next > max) next = 0;

        let tries = 0;
        while (!images[next] && tries < images.length) {
          next += dir;
          if (next < 0) next = max;
          if (next > max) next = 0;
          tries++;
        }

        if (images[next]) {
          openLightbox(next);
        }
      }

      function updateCounter() {
        const total = images.filter(Boolean).length;
        lbCounter.textContent = total > 1 ? `${currentIndex + 1} / ${total}` : '';
      }

      function updateNav() {
        const total = images.filter(Boolean).length;
        lbPrev.classList.toggle('hidden', total <= 1);
        lbNext.classList.toggle('hidden', total <= 1);
      }

      // ─── LIGHTBOX EVENTS ────────────────────────
      lbClose.addEventListener('click', closeLightbox);
      backdrop.addEventListener('click', closeLightbox);

      lbPrev.addEventListener('click', () => navigate(-1));
      lbNext.addEventListener('click', () => navigate(1));

      lbZoom.addEventListener('click', () => {
        lbImg.classList.toggle('zoomed');
        const icon = lbZoom.querySelector('i');
        if (lbImg.classList.contains('zoomed')) {
          icon.className = 'fa-regular fa-magnifying-glass-minus';
        } else {
          icon.className = 'fa-regular fa-magnifying-glass-plus';
        }
      });

      lbImg.addEventListener('dblclick', () => lbZoom.click());

      // ─── KEYBOARD ────────────────────────────────
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
      });

      // ─── SWIPE ────────────────────────────────────
      let startX = 0, startY = 0;
      lightbox.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
          navigate(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // ─── SCROLL TOP ──────────────────────────────
      window.addEventListener('scroll', () => {
        scrollTop.classList.toggle('show', window.scrollY > 400);
      }, { passive: true });

      scrollTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // ─── INIT ─────────────────────────────────────
      loadImages();

    })();
  </script>
</body>
</html>
