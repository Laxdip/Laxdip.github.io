<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature’s Canvas · retro archive</title>
  
  <!-- Simple Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Nature’s Canvas</h1>
    <p>Stories Written By Nature</p>
  </header>

  <div class="top-decoration">✦ ✦ ✦</div>
  <div class="corner-decoration"></div>

  <!-- Gallery will be populated automatically by JavaScript -->
  <div class="gallery" id="gallery"></div>

  <!-- Simple Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <footer class="footer">
    <p><span id="imageCount"></span> vintage photographs</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
